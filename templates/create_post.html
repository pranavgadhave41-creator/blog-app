
{% extends 'base.html' %}
{% block content %}
    <h1>New Post</h1>
    <form method="POST">
        <label>Title:</label>
        <input type="text" name="title" required><br>
        <label>Content:</label>
        <textarea name="content" required></textarea><br>
        <button type="submit">Publish</button>
    </form>
{% endblock %}
