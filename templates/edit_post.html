{% extends 'base.html' %}
{% block content %}
    <h1>Edit Post</h1>
    <form method="POST">
        <label>Title:</label>
        <input type="text" name="title" value="{{ post.title }}" required><br>
        <label>Content:</label>
        <textarea name="content" required>{{ post.content }}</textarea><br>
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
